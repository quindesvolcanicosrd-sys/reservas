<!DOCTYPE html>
<html lang="es">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Entrena, confirma tu asistencia y sigue al equipo.">
  <meta name="theme-color" content="#FFFBFA">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pivot">
  <link rel="apple-touch-icon" href="icons/apple-180.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Pivot</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Mientras carga Flutter: el logo sobre el fondo de la app, sin saltos. */
    html, body { margin: 0; height: 100%; background: #FFFBFA; }
    #carga { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; transition: opacity .35s ease; }
    #carga img { width: 96px; height: 96px; border-radius: 24px; }
    @media (prefers-color-scheme: dark) { html, body { background: #0E0E0E; } }
  </style>
</head>
<body>
  <div id="carga"><img src="icons/Icon-192.png" alt="Pivot"></div>
    <script>
    // Instalar la app (Android/Chrome): se guarda el aviso del navegador
    // para el botón "Instalar app" de la pantalla de instalación.
    window.pivotPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.pivotPrompt = e; });
    window.addEventListener('appinstalled', function () { window.pivotInstalada = true; });
    window.addEventListener('flutter-first-frame', function () {
      var c = document.getElementById('carga');
      if (c) { c.style.opacity = '0'; setTimeout(function () { c.remove(); }, 400); }
    });
  </script>
  <script>
    // Versión nueva antes de cargar la app (Victor, 2026-11-27: la web se
    // quedaba en una copia vieja guardada en el navegador). Si el sitio tiene
    // una publicación más nueva que esta página, se borra lo guardado y se
    // recarga. Como mucho 2 intentos por versión; si sigue vieja, se explica
    // cómo borrar la caché.
    (function () {
      var esta = Number('183') || 0;
      if (!esta || !window.fetch) return;
      fetch('web_version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
        var nueva = Number(j && j.build) || 0;
        if (nueva <= esta) { try { localStorage.removeItem('pivot.intentos'); } catch (e) {} return; }
        var intentos = {};
        try { intentos = JSON.parse(localStorage.getItem('pivot.intentos') || '{}'); } catch (e) {}
        var n = intentos[nueva] || 0;
        if (n >= 2) { avisoCache(); return; }
        intentos[nueva] = n + 1;
        try { localStorage.setItem('pivot.intentos', JSON.stringify(intentos)); } catch (e) {}
        var limpiar = [];
        if (window.caches) limpiar.push(caches.keys().then(function (k) { return Promise.all(k.map(function (x) { return caches.delete(x); })); }));
        if (navigator.serviceWorker) limpiar.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.filter(function (r) { var w = r.active || r.waiting || r.installing; return !(w && /firebase-messaging-sw/.test(w.scriptURL)); }).map(function (r) { return r.unregister(); }));
        }));
        limpiar.push(fetch('/', { cache: 'reload' }).catch(function () {}));
        Promise.all(limpiar).catch(function () {}).then(function () { location.replace('/?v=' + nueva + location.hash); });
      }).catch(function () {});
      function avisoCache() {
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;padding:14px 16px;border-radius:16px;background:#E8000D;color:#fff;font:14px/1.4 system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.25)';
        d.innerHTML = '<b>Hay una versión nueva de Pivot</b><br>Tu navegador sigue abriendo la anterior. Borra los archivos en caché del navegador (Configuración → Privacidad → Borrar datos de navegación → Imágenes y archivos en caché) y vuelve a abrir la app. <u id="pivot-cerrar">Cerrar</u>';
        document.body.appendChild(d);
        document.getElementById('pivot-cerrar').onclick = function () { d.remove(); };
      }
    })();
  </script>
  <script src="flutter_bootstrap.js?v=183" async></script>
</body>
</html>
