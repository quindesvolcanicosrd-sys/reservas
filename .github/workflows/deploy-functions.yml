name: Desplegar Edge Functions

# Despliega en Supabase las Edge Functions que cambiaron en cada push a main.
# Así los cambios del backend quedan en producción sin correr nada en la PC.
# Requiere un solo secreto del repo: SUPABASE_ACCESS_TOKEN (token personal de
# https://supabase.com/dashboard/account/tokens). `verify_jwt` de cada
# función sale de supabase/config.toml (hoy: recalcular-categorias=false).
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:
    inputs:
      funciones:
        description: 'Funciones a desplegar separadas por espacio (vacío = todas)'
        required: false
        default: ''

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: uusbnreitoobqssizbfq
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Elegir funciones a desplegar
        id: elegir
        env:
          ANTES: ${{ github.event.before }}
          PEDIDAS: ${{ github.event.inputs.funciones }}
        run: |
          TODAS=$(ls -d supabase/functions/*/ | xargs -n1 basename | grep -v '^_' | tr '\n' ' ')
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LISTA="${PEDIDAS:-$TODAS}"
          elif [ -z "$ANTES" ] || [ "$ANTES" = "0000000000000000000000000000000000000000" ] \
               || git diff --name-only "$ANTES" HEAD | grep -qE '^(supabase/config.toml|supabase/functions/_shared/|\.github/workflows/deploy-functions.yml)'; then
            LISTA="$TODAS"
          else
            LISTA=$(git diff --name-only "$ANTES" HEAD | grep '^supabase/functions/' | cut -d/ -f3 | sort -u | tr '\n' ' ')
          fi
          echo "lista=$LISTA" >> "$GITHUB_OUTPUT"
          echo "Funciones: $LISTA"

      - name: Desplegar
        if: steps.elegir.outputs.lista != ''
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN en el repo (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          for f in ${{ steps.elegir.outputs.lista }}; do
            [ -f "supabase/functions/$f/index.ts" ] || continue
            echo "::group::$f"
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" --use-api
            echo "::endgroup::"
          done
