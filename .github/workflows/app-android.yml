name: App Android

# Compila la app nativa (app/, Flutter) en cada push a main que toque app/.
# Produce el .aab firmado para subir a Google Play y un .apk para probar
# directo en el teléfono (release "app-android" del repo).
# Secretos: FIRMA_JKS_B64 (llave de subida en base64) y FIRMA_CLAVE.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/app-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-android
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Llave de firma
        env:
          FIRMA_JKS_B64: ${{ secrets.FIRMA_JKS_B64 }}
        run: |
          if [ -n "$FIRMA_JKS_B64" ]; then
            echo "$FIRMA_JKS_B64" | base64 -d > "$RUNNER_TEMP/pivot-upload.jks"
            echo "FIRMA_ARCHIVO=$RUNNER_TEMP/pivot-upload.jks" >> "$GITHUB_ENV"
            echo "FIRMADA=si" >> "$GITHUB_ENV"
          else
            echo "::warning::Faltan los secretos FIRMA_JKS_B64 y FIRMA_CLAVE: se compila con la llave de depuración y no se publica."
            echo "FIRMADA=no" >> "$GITHUB_ENV"
          fi

      - name: Revisar el código
        run: flutter analyze

      - name: Compilar
        env:
          FIRMA_CLAVE: ${{ secrets.FIRMA_CLAVE }}
        run: |
          VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))
          # "play" = paquete para Google Play; "directa" = APK que se instala
          # desde GitHub y se actualiza solo (ver app/lib/core/actualizacion.dart).
          flutter build appbundle --release --flavor play --build-number=$VERSION_CODE --build-name=1.0.$VERSION_CODE
          flutter build apk --release --flavor directa --build-number=$VERSION_CODE --build-name=1.0.$VERSION_CODE
          cp build/app/outputs/bundle/playRelease/app-play-release.aab "$RUNNER_TEMP/pivot.aab"
          cp build/app/outputs/flutter-apk/app-directa-release.apk "$RUNNER_TEMP/pivot.apk"
          echo "VERSION_NAME=1.0.$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Guardar los archivos
        uses: actions/upload-artifact@v4
        with:
          name: pivot-${{ env.VERSION_NAME }}
          path: |
            ${{ runner.temp }}/pivot.aab
            ${{ runner.temp }}/pivot.apk

      - name: Publicar en la release "app-android"
        if: env.FIRMADA == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
          MENSAJE: ${{ github.event.head_commit.message }}
        run: |
          gh release view app-android >/dev/null 2>&1 || gh release create app-android --title "App Android" --notes "Última compilación de la app Android de Pivot." --prerelease
          # version.json: la app lo lee para exigir la actualización (variante "directa").
          NOVEDADES=$(printf '%s' "$MENSAJE" | head -n 1)
          jq -n --argjson codigo "$VERSION_CODE" --arg nombre "$VERSION_NAME" --arg novedades "$NOVEDADES" \
            '{versionCode: $codigo, versionName: $nombre, novedades: $novedades}' > "$RUNNER_TEMP/version.json"
          # Primero el APK y después version.json: así nadie ve la versión nueva antes de que el APK esté disponible.
          gh release upload app-android "$RUNNER_TEMP/pivot.apk" "$RUNNER_TEMP/pivot.aab" --clobber
          gh release upload app-android "$RUNNER_TEMP/version.json" --clobber
          gh release edit app-android --notes "Versión $VERSION_NAME — $(printf '%s' "$MENSAJE" | head -n 1)"
